{{define "layout.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paperless-aissist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Render any unprocessed .chat-markdown elements after each HTMX swap
    document.addEventListener('htmx:afterSettle', function() {
      document.querySelectorAll('.chat-markdown:not([data-rendered])').forEach(function(el) {
        el.innerHTML = marked.parse(el.textContent);
        el.setAttribute('data-rendered', '1');
      });
    });
  </script>
  <style>
    body { margin: 0; }
    .app-layout { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 210px; min-width: 210px;
      background: var(--pico-primary-background);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; height: 100vh;
      padding: 0; z-index: 100;
    }
    .sidebar-brand {
      color: #fff; font-weight: 700; font-size: 0.95rem;
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.01em;
    }
    .sidebar-brand small { display: block; font-weight: 400; font-size: 0.7rem; opacity: 0.6; margin-top: 0.1rem; }
    .sidebar nav { padding: 0.5rem 0; flex: 1; }
    .sidebar nav a {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.7rem 1.25rem;
      color: rgba(255,255,255,0.75); text-decoration: none;
      font-size: 0.92rem; transition: background 0.12s, color 0.12s;
    }
    .sidebar nav a:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar nav a.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }
    .sidebar nav a svg { flex-shrink: 0; opacity: 0.85; }
    .sidebar nav a.active svg { opacity: 1; }

    /* ── Main ── */
    .main-content { margin-left: 210px; flex: 1; padding: 2rem 2.5rem; }

    /* ── Utilities ── */
    .flash { background: var(--pico-ins-color); color: #fff; padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .error-msg { background: var(--pico-del-color); color: #fff; padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .log-info { color: var(--pico-color); }
    .log-warn { color: orange; }
    .log-error { color: var(--pico-del-color); }
    .htmx-indicator { display: none; }
    .htmx-request > .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-block; }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ── Tagify ── */
    .tagify { --tag-bg: var(--pico-primary-background); --tag-text-color: #fff;
               --tag-remove-btn-color: #fff; --input-color: var(--pico-color);
               border: var(--pico-border-width) solid var(--pico-form-element-border-color);
               border-radius: var(--pico-border-radius); background: var(--pico-form-element-background-color);
               padding: 0.25rem 0.5rem; width: 100%; box-sizing: border-box; }
    .tagify:focus-within { border-color: var(--pico-primary); box-shadow: 0 0 0 var(--pico-outline-width) var(--pico-primary-focus); }
    label:has(.tagify) { margin-bottom: var(--pico-spacing); }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      paperless-aissist
      <small>AI for paperless-ngx</small>
    </div>
    <nav>
      <a href="/chat" {{if eq .ActivePage "chat"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>

      <div style="padding: 0.6rem 1.25rem 0.2rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); font-weight: 600;">Documents</div>
      <a href="/" {{if eq .ActivePage "analyze"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="11" cy="15" r="2"/><path d="m13.5 17.5 1.5 1.5"/></svg>
        Analyze
      </a>
      <a href="/scan" {{if eq .ActivePage "scan"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Auto-Scan
      </a>

      <div style="padding: 0.6rem 1.25rem 0.2rem; margin-top: 0.4rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); font-weight: 600; border-top: 1px solid rgba(255,255,255,0.1);">Developer</div>
      <a href="/settings" {{if eq .ActivePage "settings"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
      <a href="/logs" {{if eq .ActivePage "logs"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Logs
      </a>
      <a href="/prompts" {{if eq .ActivePage "prompts"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Prompts
      </a>
      <a href="/test" {{if eq .ActivePage "test"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>
        Compare
      </a>
    </nav>
    <div style="padding: 0.75rem 1rem; border-top: 1px solid rgba(255,255,255,0.15);">
      <form method="POST" action="/logout" style="margin:0 0 0.5rem">
        <button type="submit" style="width:100%; background:transparent; border:1px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.6); font-size:0.82rem; padding:0.4rem 0.75rem; cursor:pointer; border-radius:4px;">
          Sign out
        </button>
      </form>
      <div style="text-align:center; color:rgba(255,255,255,0.35); font-size:0.72rem;">{{.Version}}</div>
    </div>
  </aside>
  <main class="main-content">
    {{template "content" .}}
  </main>
</div>
</body>
</html>
{{end}}
