{{define "layout.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paperless-aissist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function linkifyDocRefs(el, sources) {
      if (!sources || !sources.length) return;
      var sorted = sources.slice().sort(function(a, b) { return b.title.length - a.title.length; });
      function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          var text = node.textContent;
          var html = escHtml(text);
          var replaced = false;
          for (var i = 0; i < sorted.length; i++) {
            var src = sorted[i];
            if (!src.title || src.title.length < 4) continue;
            var pat = src.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var re = new RegExp(pat, 'gi');
            if (re.test(html)) {
              html = html.replace(new RegExp(pat, 'gi'),
                '<a href="' + escHtml(src.paperlessUrl) + '" target="_blank" class="doc-ref-link">' + escHtml(src.title) + '</a>');
              replaced = true;
            }
          }
          if (replaced) {
            var span = document.createElement('span');
            span.innerHTML = html;
            node.parentNode.replaceChild(span, node);
          }
        } else if (node.nodeType === Node.ELEMENT_NODE &&
                   node.tagName !== 'A' && node.tagName !== 'CODE' && node.tagName !== 'PRE') {
          Array.from(node.childNodes).forEach(walk);
        }
      }
      walk(el);
    }

    document.addEventListener('htmx:afterSettle', function() {
      document.querySelectorAll('.chat-markdown:not([data-rendered])').forEach(function(el) {
        el.innerHTML = marked.parse(el.textContent);
        el.setAttribute('data-rendered', '1');
        try {
          var sources = JSON.parse(el.getAttribute('data-sources') || '[]');
          linkifyDocRefs(el, sources);
        } catch(e) {}
      });
    });
  </script>
  <style>
    /* ── Tokens ── */
    :root {
      --app-bg:         #111318;
      --app-surface:    #191c24;
      --app-surface-hi: #1f2330;
      --app-border:     #262b38;
      --app-text:       #cdd5e0;
      --app-muted:      #5c6370;
      --app-amber:      #f5a623;
      --app-amber-dim:  rgba(245, 166, 35, 0.10);
      --app-amber-glow: rgba(245, 166, 35, 0.20);
      --app-sidebar-bg: #0d0f14;
      --app-red:        #ef4444;
      --app-green:      #22c55e;

      /* PicoCSS overrides */
      --pico-font-family:                    'IBM Plex Sans', system-ui, sans-serif;
      --pico-background-color:               var(--app-bg);
      --pico-color:                          var(--app-text);
      --pico-muted-color:                    var(--app-muted);
      --pico-muted-border-color:             var(--app-border);
      --pico-primary:                        var(--app-amber);
      --pico-primary-hover:                  #e09515;
      --pico-primary-focus:                  var(--app-amber-glow);
      --pico-primary-inverse:                #111318;
      --pico-primary-background:             var(--app-amber);
      --pico-card-background-color:          var(--app-surface);
      --pico-card-border-color:              var(--app-border);
      --pico-card-sectioning-background-color: var(--app-surface-hi);
      --pico-form-element-background-color:  var(--app-surface);
      --pico-form-element-border-color:      var(--app-border);
      --pico-form-element-active-border-color: var(--app-amber);
      --pico-form-element-color:             var(--app-text);
      --pico-form-element-placeholder-color: var(--app-muted);
      --pico-form-element-focus-color:       var(--app-amber);
      --pico-switch-background-color:        var(--app-border);
      --pico-switch-checked-background-color: var(--app-amber);
      --pico-table-border-color:             var(--app-border);
      --pico-ins-color:                      var(--app-green);
      --pico-del-color:                      var(--app-red);
      --pico-code-background-color:          var(--app-sidebar-bg);
    }

    /* ── Base ── */
    body {
      margin: 0;
      background: var(--app-bg);
      color: var(--app-text);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
    }
    code, kbd, pre, samp, .mono {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
    a { color: var(--app-amber); }
    a:hover { color: #e09515; }

    /* ── Page headings ── */
    h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--app-border);
      color: var(--app-text);
    }
    h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--app-text);
    }

    /* ── Article cards ── */
    article {
      background: var(--app-surface);
      border-color: var(--app-border);
      border-left: 3px solid var(--app-amber);
      padding: 0;
    }
    article > header {
      font-size: 0.68rem !important;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--app-muted) !important;
      border-bottom-color: var(--app-border);
      padding: 0.65rem 1rem;
    }
    article > *:not(header) {
      padding-left: 1rem;
      padding-right: 1rem;
    }
    article > *:last-child { padding-bottom: 1rem; }
    article > header + * { margin-top: 1rem; }

    /* ── Form elements ── */
    input, select, textarea {
      font-size: 0.875rem !important;
    }
    label {
      font-size: 0.82rem;
      font-weight: 500;
    }
    button, [type="submit"], [type="button"], [type="reset"] {
      font-size: 0.875rem;
      font-weight: 500;
    }

    /* ── Layout ── */
    .app-layout { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 210px; min-width: 210px;
      background: var(--app-sidebar-bg);
      border-right: 1px solid var(--app-border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; height: 100vh;
      padding: 0; z-index: 200;
      transition: left 0.25s ease;
    }
    .sidebar-brand {
      color: var(--app-text);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--app-border);
      letter-spacing: 0.02em;
    }
    .sidebar-brand strong { color: var(--app-amber); }
    .sidebar-brand small {
      display: block; font-weight: 400; font-size: 0.68rem;
      color: var(--app-muted); margin-top: 0.15rem; letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .sidebar nav { padding: 0.5rem 0; flex: 1; }
    .sidebar-section {
      padding: 0.75rem 1.25rem 0.2rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--app-muted);
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      border-top: 1px solid var(--app-border);
      margin-top: 0.25rem;
    }
    .sidebar nav a {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.6rem 1.25rem;
      color: var(--app-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
      border-left: 2px solid transparent;
      margin: 0 0 1px;
    }
    .sidebar nav a:hover {
      background: rgba(255,255,255,0.04);
      color: var(--app-text);
      border-left-color: rgba(245, 166, 35, 0.35);
    }
    .sidebar nav a.active {
      background: var(--app-amber-dim);
      color: var(--app-amber);
      border-left-color: var(--app-amber);
      font-weight: 600;
    }
    .sidebar nav a svg { flex-shrink: 0; opacity: 0.7; }
    .sidebar nav a:hover svg { opacity: 0.9; }
    .sidebar nav a.active svg { opacity: 1; }

    /* ── Sidebar overlay (mobile) ── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 199;
    }
    .sidebar-overlay.open { display: block; }

    /* ── Mobile top bar ── */
    .mobile-topbar {
      display: none;
      align-items: center; gap: 0.75rem;
      background: var(--app-sidebar-bg);
      border-bottom: 1px solid var(--app-border);
      color: var(--app-text); padding: 0.75rem 1rem;
      position: sticky; top: 0; z-index: 100;
      margin: -1rem -1rem 1rem;
    }
    .mobile-topbar-brand { font-weight: 700; font-size: 0.9rem; flex: 1; color: var(--app-amber); }
    .hamburger {
      background: transparent; border: none; cursor: pointer;
      color: var(--app-muted); padding: 0.25rem; display: flex; align-items: center;
    }

    /* ── Main ── */
    .main-content { margin-left: 210px; flex: 1; padding: 2rem 2.5rem; }

    /* ── Chat ── */
    .chat-container { display: flex; flex-direction: column; height: calc(100vh - 360px); min-height: 300px; }

    /* ── Responsive grid ── */
    .responsive-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 2rem; }

    /* ── Utilities ── */
    .flash {
      background: rgba(34, 197, 94, 0.12);
      color: var(--app-green);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .log-info { color: var(--app-text); }
    .log-warn { color: #fb923c; }
    .log-error { color: #f87171; }
    .htmx-indicator { display: none; }
    .htmx-request > .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-block; }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ── Tagify dark ── */
    .tagify {
      --tag-bg: rgba(245, 166, 35, 0.15);
      --tag-text-color: var(--app-amber);
      --tag-border-color: rgba(245, 166, 35, 0.3);
      --tag-remove-btn-color: var(--app-amber);
      --tags-focus-border-color: var(--app-amber);
      --input-color: var(--app-text);
      border: 1px solid var(--app-border);
      border-radius: var(--pico-border-radius);
      background: var(--app-surface);
      padding: 0.25rem 0.5rem; width: 100%; box-sizing: border-box;
    }
    .tagify:focus-within { border-color: var(--app-amber); box-shadow: 0 0 0 3px var(--app-amber-glow); }
    label:has(.tagify) { margin-bottom: var(--pico-spacing); }
    .tagify__dropdown { background: var(--app-surface-hi); border-color: var(--app-border); }
    .tagify__dropdown__item { color: var(--app-text); }
    .tagify__dropdown__item--active { background: var(--app-amber-dim); color: var(--app-amber); }

    /* ── Doc reference links ── */
    .doc-ref-link { color: var(--app-amber); text-decoration: underline dotted; text-underline-offset: 2px; }
    .doc-ref-link:hover { text-decoration: underline; }

    /* ── Sidebar footer ── */
    .sidebar-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--app-border);
    }
    .sidebar-footer button {
      width: 100%;
      background: transparent;
      border: 1px solid var(--app-border);
      color: var(--app-muted);
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
      transition: border-color 0.1s, color 0.1s;
      margin-bottom: 0.5rem;
    }
    .sidebar-footer button:hover {
      border-color: var(--app-muted);
      color: var(--app-text);
    }
    .sidebar-version {
      text-align: center;
      color: var(--app-muted);
      font-size: 0.68rem;
      font-family: 'IBM Plex Mono', monospace;
      opacity: 0.6;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar { left: -220px; }
      .sidebar.open { left: 0; }
      .mobile-topbar { display: flex; }
      .main-content { margin-left: 0; padding: 1rem; }
      .chat-container { height: calc(100vh - 280px); }
      .responsive-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <strong>paperless</strong>-aissist
      <small>AI for paperless-ngx</small>
    </div>
    <nav>
      <a href="/chat" {{if eq .ActivePage "chat"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>

      <div class="sidebar-section">Documents</div>
      <a href="/analyze" {{if eq .ActivePage "analyze"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="11" cy="15" r="2"/><path d="m13.5 17.5 1.5 1.5"/></svg>
        Analyze
      </a>
      <a href="/scan" {{if eq .ActivePage "scan"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Auto-Scan
      </a>

      <div class="sidebar-section">Developer</div>
      <a href="/settings" {{if eq .ActivePage "settings"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
      <a href="/logs" {{if eq .ActivePage "logs"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Logs
      </a>
      <a href="/prompts" {{if eq .ActivePage "prompts"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Prompts
      </a>
      <a href="/test" {{if eq .ActivePage "test"}}class="active"{{end}}>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>
        Compare
      </a>
    </nav>
    <div class="sidebar-footer">
      <form method="POST" action="/logout" style="margin:0 0 0.5rem">
        <button type="submit">Sign out</button>
      </form>
      <div class="sidebar-version">{{.Version}}</div>
    </div>
  </aside>
  <main class="main-content">
    <div class="mobile-topbar">
      <button class="hamburger" id="sidebar-toggle" aria-label="Navigation öffnen">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="mobile-topbar-brand">paperless-aissist</span>
    </div>
    {{template "content" .}}
  </main>
</div>
<script>
  (function() {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var toggle = document.getElementById('sidebar-toggle');
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('nav a').forEach(function(a) {
        a.addEventListener('click', closeSidebar);
      });
    }
  })();
</script>
</body>
</html>
{{end}}
