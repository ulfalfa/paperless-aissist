{{define "content"}}
{{$cfg := .Data.Config}}
{{$models := .Data.Models}}
<h2 style="margin-bottom:0.25rem;">Test &amp; Compare</h2>
<p style="color:var(--pico-muted-color); margin-bottom:1.5rem;">
  Run the same document through two different model configurations and compare results side by side.
</p>

<form hx-post="/ui/test/compare" hx-target="#test-result" hx-swap="innerHTML" hx-indicator="#test-spinner">

  <article style="margin-bottom:1rem;">
    <header>Document</header>
    <label style="max-width:20rem;">
      Document ID
      <input type="number" name="documentId" min="1" placeholder="e.g. 42" required>
    </label>
  </article>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1rem;">

    {{/* Config A */}}
    <article>
      <header>Config A <small style="font-weight:400; color:var(--pico-muted-color);">(current settings)</small></header>
      <label>Model
        <select name="a_model">
          <option value="">{{$cfg.OllamaModel}} (default)</option>
          {{range $models}}<option value="{{.}}">{{.}}</option>{{end}}
        </select>
      </label>
      <div class="grid">
        <label>Temperature<input type="number" name="a_temperature" value="{{if $cfg.Temperature}}{{$cfg.Temperature}}{{end}}" step="0.05" min="0" max="2" placeholder="default"></label>
        <label>Top K<input type="number" name="a_topK" value="{{if $cfg.TopK}}{{$cfg.TopK}}{{end}}" min="0" placeholder="default"></label>
      </div>
      <div class="grid">
        <label>Top P<input type="number" name="a_topP" value="{{if $cfg.TopP}}{{$cfg.TopP}}{{end}}" step="0.05" min="0" max="1" placeholder="default"></label>
        <label>Repeat Penalty<input type="number" name="a_repeatPenalty" value="{{if $cfg.RepeatPenalty}}{{$cfg.RepeatPenalty}}{{end}}" step="0.05" min="0" placeholder="default"></label>
      </div>
      <label>Context Size<input type="number" name="a_numCtx" value="{{if $cfg.NumCtx}}{{$cfg.NumCtx}}{{end}}" min="0" placeholder="default"></label>
      <label>
        <input type="checkbox" name="a_think" {{if $cfg.Think}}checked{{end}}>
        Thinking mode
      </label>
    </article>

    {{/* Config B */}}
    <article>
      <header>Config B <small style="font-weight:400; color:var(--pico-muted-color);">(your override)</small></header>
      <label>Model
        <select name="b_model">
          <option value="">{{$cfg.OllamaModel}} (default)</option>
          {{range $models}}<option value="{{.}}">{{.}}</option>{{end}}
        </select>
      </label>
      <div class="grid">
        <label>Temperature<input type="number" name="b_temperature" step="0.05" min="0" max="2" placeholder="default"></label>
        <label>Top K<input type="number" name="b_topK" min="0" placeholder="default"></label>
      </div>
      <div class="grid">
        <label>Top P<input type="number" name="b_topP" step="0.05" min="0" max="1" placeholder="default"></label>
        <label>Repeat Penalty<input type="number" name="b_repeatPenalty" step="0.05" min="0" placeholder="default"></label>
      </div>
      <label>Context Size<input type="number" name="b_numCtx" min="0" placeholder="default"></label>
      <label>
        <input type="checkbox" name="b_think">
        Thinking mode
      </label>
    </article>

  </div>

  <button type="submit">
    <span id="test-spinner" class="htmx-indicator spinner" style="margin-right:0.4rem;">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    </span>
    Compare A vs B
  </button>
</form>

<div id="test-result"></div>
{{end}}
