{{define "cleanup.html"}}
{{template "layout.html" .}}
{{end}}

{{define "content"}}
<h2>Tag Cleanup</h2>
<p>Analyze your tags and get AI-powered suggestions for merging or deleting redundant tags.</p>

<article>
  <header>Load Tags</header>
  <p style="color: var(--pico-muted-color); font-size: 0.9rem;">Fetch all tags with their document counts</p>
  <form hx-post="/ui/cleanup/load" hx-target="#tag-list" hx-indicator="#spinner">
    <button type="submit">
      <span id="spinner" class="htmx-indicator spinner">⟳</span>
      Load Tags
    </button>
  </form>
</article>

<div id="tag-list"></div>
<div id="analysis-result" style="margin-top: 2rem;"></div>
{{end}}
