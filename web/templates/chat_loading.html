{{define "chat_loading.html"}}
<div class="chat-wrap"
     id="chat-loading-{{.JobID}}"
     hx-get="/ui/chat/status/{{.JobID}}"
     hx-trigger="every 600ms"
     hx-swap="outerHTML">
  <div class="chat-bubble chat-bubble-user">{{.Question}}</div>
  <div class="chat-bubble chat-bubble-assistant" style="display:flex; align-items:center; gap:0.5rem;">
    <span class="spinner" style="font-size:1rem;">⟳</span>
    <span style="color: var(--pico-muted-color); font-size: 0.88rem;">{{.Status}}</span>
  </div>
</div>
{{end}}
