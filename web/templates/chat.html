{{define "chat.html"}}
{{template "layout.html" .}}
{{end}}

{{define "content"}}
<h2>Chat with Documents</h2>

<div class="chat-container">

  <!-- Message history -->
  <div id="chat-messages"
       style="flex: 1; overflow-y: auto; padding: 0.5rem 0; margin-bottom: 1rem;">
    <p id="chat-placeholder" style="color: var(--pico-muted-color); font-size: 0.9rem; text-align: center; margin-top: 2rem;">
      Ask anything about your documents.
    </p>
  </div>

  <!-- Input area -->
  <div style="border-top: 1px solid var(--app-border); padding-top: 1rem;">
    <form id="chat-form"
          hx-post="/ui/chat"
          hx-target="#chat-messages"
          hx-swap="beforeend">
      <input type="hidden" name="chatModel" id="chat-model-hidden" value="{{.Data.DefaultModel}}">
      <input type="hidden" name="history" id="chat-history" value="[]">
      <input type="hidden" name="pinned_ids" id="chat-pinned-ids" value="[]">
      <input type="hidden" name="think" id="chat-think-hidden" value="{{.Data.ThinkDefault}}">

      <!-- Row 1: model + think toggle -->
      <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem; align-items:center;">
        <select id="chat-model" style="flex:1; margin:0;">
          {{range .Data.Models}}
          <option value="{{.}}" {{if eq . $.Data.DefaultModel}}selected{{end}}>{{.}}</option>
          {{end}}
        </select>
        <button type="button" id="think-toggle"
                class="outline secondary"
                style="margin:0; white-space:nowrap; flex-shrink:0;"
                title="Thinking: off">
          Thinking
        </button>
      </div>

      <!-- Row 2: textarea + send -->
      <div style="display:flex; gap:0.5rem; align-items:flex-end;">
        <textarea id="question" name="question" rows="2"
                  placeholder="Frage stellen…"
                  style="flex:1; resize:none; margin:0;"
                  required></textarea>
        <button type="submit" style="margin:0; flex-shrink:0; align-self:flex-end;">Send</button>
      </div>
    </form>
  </div>

</div>

<style>
  .chat-wrap { margin-bottom: 1rem; }
  .chat-bubble {
    max-width: 78%;
    padding: 0.65rem 1rem;
    border-radius: 1rem;
    line-height: 1.6;
    word-wrap: break-word;
    font-size: 0.9rem;
  }
  .chat-bubble-user {
    background: var(--app-amber);
    color: #111318;
    font-weight: 500;
    margin-left: auto;
    border-bottom-right-radius: 0.2rem;
  }
  .chat-bubble-assistant {
    background: var(--app-surface);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    margin-right: auto;
    margin-top: 0.4rem;
    border-bottom-left-radius: 0.2rem;
    border-left: 2px solid var(--app-amber);
  }
  .chat-markdown > *:first-child { margin-top: 0; }
  .chat-markdown > *:last-child { margin-bottom: 0; }
  .chat-markdown p { margin: 0.4rem 0; }
  .chat-markdown ul, .chat-markdown ol { margin: 0.4rem 0; padding-left: 1.4rem; }
  .chat-markdown code { font-size: 0.85em; font-family: 'IBM Plex Mono', monospace; }
  .chat-markdown pre { margin: 0.5rem 0; }
  .chat-markdown h1, .chat-markdown h2, .chat-markdown h3 { margin: 0.6rem 0 0.3rem; font-size: 1em; font-weight: 700; }
</style>

<script>
  (function() {
    const sel = document.getElementById('chat-model');
    const hidden = document.getElementById('chat-model-hidden');
    const msgs = document.getElementById('chat-messages');
    const form = document.getElementById('chat-form');

    // Restore last model from localStorage
    const saved = localStorage.getItem('paperless-chat-model');
    if (saved && sel.querySelector('option[value="' + saved + '"]')) {
      sel.value = saved;
      hidden.value = saved;
    }
    sel.addEventListener('change', function() {
      hidden.value = this.value;
      localStorage.setItem('paperless-chat-model', this.value);
    });

    // Auto-scroll to bottom after new messages
    document.body.addEventListener('htmx:afterSettle', function(e) {
      if (msgs) msgs.scrollTop = msgs.scrollHeight;
    });

    // Clear textarea and hide placeholder after submit
    form.addEventListener('htmx:afterRequest', function() {
      const q = document.getElementById('question');
      if (q) q.value = '';
      const placeholder = document.getElementById('chat-placeholder');
      if (placeholder) placeholder.remove();
    });

    // Enter = send, Shift+Enter = new line
    document.getElementById('question').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        htmx.trigger(form, 'submit');
      }
    });

    // Think toggle
    const thinkHidden = document.getElementById('chat-think-hidden');
    const thinkBtn = document.getElementById('think-toggle');
    function updateThinkBtn() {
      const active = thinkHidden.value === 'true';
      thinkBtn.classList.toggle('outline', !active);
      thinkBtn.title = active ? 'Thinking aktiv — klicken zum Deaktivieren' : 'Thinking inaktiv — klicken zum Aktivieren';
    }
    updateThinkBtn();
    thinkBtn.addEventListener('click', function() {
      thinkHidden.value = thinkHidden.value === 'true' ? 'false' : 'true';
      localStorage.setItem('paperless-chat-think', thinkHidden.value);
      updateThinkBtn();
    });
    // Restore from localStorage
    const savedThink = localStorage.getItem('paperless-chat-think');
    if (savedThink !== null) {
      thinkHidden.value = savedThink;
      updateThinkBtn();
    }
  })();
</script>
{{end}}
