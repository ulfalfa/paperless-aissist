stages:
  - lint
  - release
  - build

# ─── Conventional Commit lint on every MR ────────────────────────────────────
commitlint:
  stage: lint
  image: node:lts-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to HEAD

# ─── semantic-release: version bump + GitLab release on merge to main ────────
release:
  stage: release
  image: node:lts-alpine
  rules:
    - if: '$CI_COMMIT_TITLE =~ /^chore\(release\):/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apk add --no-cache git
    - export GITLAB_TOKEN="${GL_TOKEN}"
    - npm install --no-save semantic-release @semantic-release/commit-analyzer
        @semantic-release/release-notes-generator @semantic-release/changelog
        @semantic-release/git @semantic-release/gitlab
  script:
    - npx semantic-release

# ─── Cross-compile + upload binaries when a version tag is pushed ────────────
build:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  before_script:
    - apk add --no-cache curl
  script:
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}" \
        -o paperless-aissist-linux-amd64 .
    - |
      CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}" \
        -o paperless-aissist-darwin-arm64 .
    - |
      # Upload binaries to Generic Package Registry
      for binary in paperless-aissist-linux-amd64 paperless-aissist-darwin-arm64; do
        curl --silent --fail --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${binary}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/${binary}"
      done
    - |
      # Create or update GitLab release with binary download links
      LINUX_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/paperless-aissist-linux-amd64"
      MAC_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/paperless-aissist-darwin-arm64"
      RELEASES_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

      # Try to create the release with asset links included
      HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
        --request POST \
        --header "PRIVATE-TOKEN: ${GL_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"name\": \"Release ${CI_COMMIT_TAG}\",
          \"assets\": {
            \"links\": [
              {\"name\": \"Linux x86_64\",        \"url\": \"${LINUX_URL}\", \"link_type\": \"package\"},
              {\"name\": \"macOS Apple Silicon\",  \"url\": \"${MAC_URL}\",   \"link_type\": \"package\"}
            ]
          }
        }" \
        "${RELEASES_API}")

      echo "Release create HTTP: ${HTTP}"

      if [ "${HTTP}" != "200" ] && [ "${HTTP}" != "201" ]; then
        # Release already exists (created by semantic-release) — add links separately
        for entry in "Linux x86_64|${LINUX_URL}" "macOS Apple Silicon|${MAC_URL}"; do
          name="${entry%%|*}"
          url="${entry##*|}"
          curl -s --request POST \
            --header "PRIVATE-TOKEN: ${GL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"name\": \"${name}\", \"url\": \"${url}\", \"link_type\": \"package\"}" \
            "${RELEASES_API}/${CI_COMMIT_TAG}/assets/links" || true
        done
      fi
