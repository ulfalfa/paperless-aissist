stages:
  - lint
  - release
  - build

# ─── Conventional Commit lint on every MR ────────────────────────────────────
commitlint:
  stage: lint
  image: node:lts-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to HEAD

# ─── semantic-release: version bump + GitLab release on merge to main ────────
release:
  stage: release
  image: node:lts-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  variables:
    GL_TOKEN: $GL_TOKEN       # set in GitLab → Settings → CI/CD → Variables
    GITLAB_TOKEN: $GL_TOKEN   # semantic-release/gitlab reads either name
  before_script:
    - npm install --no-save semantic-release @semantic-release/commit-analyzer
        @semantic-release/release-notes-generator @semantic-release/gitlab
  script:
    - npx semantic-release

# ─── Cross-compile + upload binaries when a version tag is pushed ────────────
build:
  stage: build
  image: golang:1.24-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  before_script:
    - apk add --no-cache curl
  script:
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}" \
        -o paperless-aissist-linux-amd64 .
    - |
      CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}" \
        -o paperless-aissist-darwin-arm64 .
    - |
      # Upload to Generic Package Registry
      for binary in paperless-aissist-linux-amd64 paperless-aissist-darwin-arm64; do
        curl --silent --fail --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${binary}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/${binary}"
      done
    - |
      # Attach binaries as download links to the existing GitLab release
      curl --silent --fail --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${GL_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"Linux x86_64\",
          \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/paperless-aissist-linux-amd64\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
    - |
      curl --silent --fail --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${GL_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"macOS Apple Silicon\",
          \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paperless-aissist/${CI_COMMIT_TAG}/paperless-aissist-darwin-arm64\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
